<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Tracker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #fff;
      color: #000;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 16px;
    }

    .header h1 {
      font-size: 26px;
      margin-top: 4px;
    }

    .date {
      font-size: 14px;
      color: #666;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }

    .card {
      flex: 1;
      background: #f5f5f5;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .card span {
      color: #555;
      font-size: 14px;
    }

    .card h2 {
      font-size: 26px;
    }

    #search {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #f5f5f5;
      border: none;
      margin-bottom: 14px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .student {
      padding: 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .student.absent {
      background: #ec1f1f;
      color: #fff;
    }

    .student.present {
      background: #05cc6c;
      color: #fff;
    }

    .info {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #000;
    }

    .details {
      display: flex;
      flex-direction: column;
    }

    .roll {
      font-size: 12px;
    }

    .name {
      font-size: 15px;
    }

    .toggle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .toggle.active {
      background: #fff;
    }

    .actions,
    .copy-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .actions {
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
    }

    .print {
      /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
      font-size: 20px;
      font-weight: 500;
      background: #0174d3;
    }

    #saveBtn,
    .copy-present,
    .copy-absent {
      font-weight: 500;
    }

    .copy-present {
      background: #00e676;
    }

    .copy-absent {
      background: #ff4d4d;
      color: #fff
    }

    /* PRINT STYLES */
    @media print {
      body {
        font-size: 11px
      }

      .actions,
      .copy-actions,
      #search,
      .toggle {
        display: none
      }

      .student.present {
        background: #c8f7dc !important;
        color: #000
      }

      .student.absent {
        background: #f9caca !important;
        color: #000
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="header">
      <p class="date" id="today"></p>
      <h1>Attendance Tracker</h1>
    </div>

    <div class="stats">
      <div class="card">
        <span>Present</span>
        <h2 id="presentCount">0</h2>
      </div>
      <div class="card">
        <span>Absent</span>
        <h2 id="absentCount">0</h2>
      </div>
    </div>

    <input id="search" placeholder="Search by name or roll no..." />

    <div id="studentList" class="list"></div>

    <div class="copy-actions">
      <button class="copy-present" onclick="copyList('present')">Copy Presentees</button>
      <button class="copy-absent" onclick="copyList('absent')">Copy Absentees</button>
    </div>

    <div class="actions">
      <button onclick="clearAll()">Clear All</button>
      <button class="print" onclick="window.print()">Print</button>
      <button id="saveBtn" onclick="saveAttendance()">Save to Google Sheet</button>
      <!-- <button onclick="resetAttendance()">Admin Reset</button> -->




    </div>

  </div>

  <script>

      { roll: "24100030022", name: "Himanshu Nain" }
    ];

    const list = document.getElementById("studentList");
    const presentCount = document.getElementById("presentCount");
    const absentCount = document.getElementById("absentCount");

    // Render students
    students.forEach(s => {
      const d = document.createElement("div");
      d.className = "student absent";
      d.innerHTML = `
      <div class="info">
        <div class="avatar">${s.name[0]}</div>
        <div class="details">
          <div class="roll">${s.roll}</div>
          <div class="name">${s.name}</div>
          <div class="status">Absent</div>
        </div>
      </div>
      <div class="toggle"></div>
    `;
      d.onclick = () => {
        d.classList.toggle("present");
        d.classList.toggle("absent");
        d.querySelector(".toggle").classList.toggle("active");
        d.querySelector(".status").textContent =
          d.classList.contains("present") ? "Present" : "Absent";
        update();
      };
      list.appendChild(d);
    });

    function update() {
      const p = document.querySelectorAll(".student.present").length;
      presentCount.textContent = p;
      absentCount.textContent = students.length - p;
    }

    function clearAll() {
      document.querySelectorAll(".student").forEach(s => {
        s.classList.remove("present");
        s.classList.add("absent");
        s.querySelector(".status").textContent = "Absent";
        s.querySelector(".toggle").classList.remove("active");
      });
      update();
    }

    function copyList(type) {
      const now = new Date();
      let text = `Frontier (${type === "present" ? "Presentee" : "Absentee"})\n`;
      text += `Date & Time: ${now.toLocaleString()}\n\n`;
      const listEls = document.querySelectorAll(`.student.${type}`);
      text += `Total: ${listEls.length}\n\n`;
      listEls.forEach(s => {
        text += `${s.querySelector(".roll").textContent.slice(-5)} - ${s.querySelector(".name").textContent}\n`;
      });
      navigator.clipboard.writeText(text);
      alert("Copied ✅");
    }

    function saveAttendance() {
      const subject = prompt("Enter Subject Name:");
      if (!subject) return alert("Subject is required!");

      const studentsData = [];
      document.querySelectorAll(".student").forEach(s => {
        studentsData.push({
          roll: s.querySelector(".roll").textContent,
          name: s.querySelector(".name").textContent,
          status: s.classList.contains("present") ? "Present" : "Absent"
        });
      });

      fetch("https://script.google.com/macros/s/AKfycbxYi0v_QfgXKDzLXp0jhmR5-Ey9gdoPic546UDY5O89j5NUIkJo4YKc3OvBl0pplETqpw/exec", {
        method: "POST",
        body: JSON.stringify({
          secret: SECRET_KEY,
          subject,
          date: new Date().toISOString(),
          students: studentsData
        })
      })
        .then(res => res.json())
        .then(res => {
          if (!res.success) return alert(res.message || "Error");
          document.getElementById("saveBtn").disabled = true;
          document.getElementById("saveBtn").textContent = "Attendance Locked";
          alert("Attendance saved & locked ✅");
        })
        .catch(() => alert("Server error ❌"));
    }

    document.getElementById("today").textContent = new Date().toDateString();
    update();

    const searchInput = document.getElementById("search");
    searchInput.addEventListener("input", () => {
      const value = searchInput.value.toLowerCase();
      document.querySelectorAll(".student").forEach(s => {
        const name = s.querySelector(".name").textContent.toLowerCase();
        const roll = s.querySelector(".roll").textContent.toLowerCase();
        s.style.display = name.includes(value) || roll.includes(value) ? "flex" : "none";
      });
    });
  </script>


</body>

</html>
