<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <div class="header">
      <p class="date" id="today"></p>
      <h1>Attendance Tracker</h1>
    </div>

    <div class="stats">
      <div class="card">
        <span>Present</span>
        <h2 id="presentCount">0</h2>
      </div>
      <div class="card">
        <span>Total</span>
        <h2 id="totalCount">0</h2>
      </div>
    </div>

    <input type="text" id="search" placeholder="Search student..." />

    <div id="studentList" class="list"></div>

    <div class="actions">
      <button class="clear" onclick="clearAll()">Clear All</button>
      <button class="save" onclick="printAttendance()">Print</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
