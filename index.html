<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Attendance App</title>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 10px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      color: #333;
      font-size: 22px;
    }

    .date {
      text-align: center;
      margin-bottom: 15px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #4f46e5;
      color: white;
      padding: 10px;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      text-align: center;
    }

    td.name {
      text-align: left;
      font-weight: 500;
    }

    input[type="radio"] {
      transform: scale(1.3);
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      color: white;
      width: 180px;
    }

    .btn-print { background: #16a34a; }
    .btn-pdf { background: #dc2626; }

    @media (max-width: 600px) {
      .actions { flex-direction: column; }
      button { width: 100%; }
      th, td { font-size: 13px; padding: 6px; }
    }

    @media (max-width: 480px) {
      th:nth-child(2),
      td:nth-child(2) {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📋 Class Attendance</h1>
  <div class="date">Date: <span id="today"></span></div>

  <div class="table-wrapper">
    <table id="attendanceTable">
      <tr>
        <th>#</th>
        <th>Roll No</th>
        <th>Student Name</th>
        <th>P</th>
        <th>A</th>
      </tr>
    </table>
  </div>

  <div class="actions">
    <button class="btn-print" onclick="window.print()">🖨 Print</button>
    <button class="btn-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</div>

<script>
const students = [

];

const table = document.getElementById("attendanceTable");

students.forEach((s, i) => {
  const row = table.insertRow();
  row.innerHTML = `
    <td>${i + 1}</td>
    <td>${s[0]}</td>
    <td class="name">${s[1]}</td>
    <td><input type="radio" name="att${i}" checked></td>
    <td><input type="radio" name="att${i}"></td>
  `;
});

const today = new Date();
document.getElementById("today").innerText = today.toDateString();

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Class Attendance - " + today.toDateString(), 10, 10);

  let y = 20;
  students.forEach((s, i) => {
    const radios = document.querySelectorAll(`input[name=att${i}]`);
    const present = radios[0].checked;
    doc.text(`${i + 1}. ${s[1]} - ${present ? "Present" : "Absent"}`, 10, y);
    y += 7;
    if (y > 280) { doc.addPage(); y = 10; }
  });

  doc.save("attendance.pdf");
}
</script>

</body>
</html>
